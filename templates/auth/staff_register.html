{% extends 'base.html' %}
{% block title %}Staff Registration - TrekTheHills{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header">
      <h1 class="auth-title">Staff Registration</h1>
      <p class="auth-subtitle">Register as Trek Staff </p>
    </div>

    <div class="auth-card-body">
      <form method="POST" action="{{ url_for('auth.staff_register') }}">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" id="full_name" class="form-control" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" id="username" class="form-control" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" id="email" class="form-control" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" id="phone" class="form-control" placeholder="Contact number">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" id="password" class="form-control" placeholder="Min 6 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Repeat password" required>
        </div>
        <button type="submit" id="staff-register-btn" class="btn btn-primary w-100">
          Submit Registration
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
      <p>Trekker? <a href="{{ url_for('auth.register') }}">Register as Trekker</a></p>
    </div>
  </div>
</div>
{% endblock %}
